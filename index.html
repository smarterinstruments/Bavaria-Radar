<title>Semiconductor Value Chain Radar – Bavaria preview</title>
<meta name="description" content="Weekly radar of what the members of the Czech National Semiconductor Cluster publish: products, investments, projects, events, partnerships and awards.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* CNSC brand: cleanroom light, brand blue #0066B5 (from the member catalogue); dark theme is its own set of steps */
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --panel2:#F6F8FA; --ink:#10161D; --muted:#5A6672; --faint:#8A96A3; --line:#D6DCE2; --line2:#E6EAEE;

  --shadow:0 12px 30px -18px rgba(20,80,143,.35);
}

  --blue:#3B8FD9; --blue-deep:#6FAEE8; --blue-soft:#1A2A3D; --chip:#0B1017; --chip-ink:#E8EDF2; --chip-line:rgba(255,255,255,.14);
  --ring1:#3B8FD9; --ring2:#2F6AA3; --ring3:#2A4866; --ring4:#273140; --warn:#F2B35A; --warn-bg:#2A2110;
  --seg-design:#3B8FD9; --seg-materials:#D97706; --seg-fab:#0D9488; --seg-equipment:#8B5CF6; --seg-test:#EC4899; --seg-apps:#65A30D; --seg-research:#C2410C; --seg-eco:#16A34A;
  --shadow:0 12px 30px -18px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --panel:#161D27; --panel2:#1B2330; --ink:#E8EDF2; --muted:#A5AFBC; --faint:#6F7A89; --line:#2A3441; --line2:#222B37;

  --shadow:0 12px 30px -18px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.4;-webkit-font-smoothing:antialiased;font-size:15px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
a{color:var(--blue)}
h1,h2,h3,h4{font-family:"Space Grotesk",Inter,sans-serif;text-wrap:balance;letter-spacing:-.01em}
.strip{display:flex;flex-wrap:wrap;gap:6px 18px;padding:14px 0 10px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);align-items:center}
.strip b{color:var(--ink);font-weight:600}
.strip .sp{flex:1}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--panel)}
.lang button{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;letter-spacing:.08em;padding:5px 11px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.lang button.on{background:var(--blue);color:#fff}
.hero{padding:18px 0 4px;display:grid;grid-template-columns:1fr auto;gap:12px 32px;align-items:end}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:10px;margin-bottom:8px}
.eyebrow::before{content:"";width:30px;height:2px;background:var(--blue)}
h1{font-weight:700;font-size:clamp(24px,3.4vw,38px);line-height:1.1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1 #h1t{white-space:nowrap}
h1 .alpha{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:4px 8px;font-weight:600;line-height:1.2}
h1 .fb{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);border:1px solid var(--blue);border-radius:6px;padding:4px 10px;font-weight:600;text-decoration:none;white-space:nowrap;line-height:1.2}
h1 .fb:hover{background:var(--blue);color:#fff}
.lede{max-width:none;margin-top:8px;font-size:16px;color:var(--muted)}
.logo{height:64px;width:auto;display:block;justify-self:end}
.banner{margin:18px 0 6px;background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:10px;padding:10px 14px;font-size:13.5px;color:var(--ink)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0 0;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:600;font-size:14px;padding:10px 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.tabs a.ext{font:inherit;font-weight:600;font-size:14px;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);text-decoration:none;margin-bottom:-1px;margin-left:auto}
.tabs a.ext:hover{color:var(--blue)}
.panel{display:none;padding:16px 0 28px}
.panel.on{display:block}
h2{font-size:22px;font-weight:600;margin:0 0 6px}
.sub{color:var(--muted);max-width:none;margin-bottom:12px}
.fine{font-size:12.5px;color:var(--muted);max-width:80ch}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:2px 0 14px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px 9px;min-width:0}
.st .v{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.st .l{margin-top:6px;font-weight:600;font-size:14px;line-height:1.3}
.st .s{margin-top:4px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);line-height:1.4}
/* radar */
.radarwrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(250px,.7fr);gap:16px;align-items:start}
.radar{background:var(--chip);border-radius:16px;padding:12px;position:relative;box-shadow:0 24px 60px -28px rgba(12,24,38,.45)}
.radar svg{display:block;width:100%;height:auto}
.key{display:flex;flex-direction:column;gap:7px}
.rk{border-left:3px solid var(--c);padding:6px 0 6px 12px;background:var(--panel);border-radius:0 8px 8px 0}
.rk .n{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rk .t{font-weight:600;font-size:15px}
.rk .w{font-size:12.5px;color:var(--muted);margin-top:2px}
.seglist{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);margin-top:4px}
.centre{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:10px;padding:12px 16px 11px;margin-bottom:10px}
.centre .ch{display:flex;justify-content:space-between;gap:12px 20px;align-items:flex-start;flex-wrap:wrap}
.centre h3{font-family:"Space Grotesk",sans-serif;font-size:19px;font-weight:700;margin:0;letter-spacing:-.01em}
.centre .kind{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-top:3px}
.centre .links{display:flex;gap:14px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:12px}
.centre .lead{font-size:13.5px;margin-top:10px}
.centre .lead .ln{color:var(--muted)}
.centre p{font-size:14px;color:var(--ink);margin:8px 0 0;max-width:78ch}
.centre .facts{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.centre h4{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px;display:flex;gap:10px;align-items:baseline}
.centre h4 .cnt{font-weight:400;letter-spacing:0;text-transform:none;color:var(--faint)}
.centre .parts{display:flex;flex-wrap:wrap;gap:6px 8px}
.centre .cp{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;background:var(--bg)}
.centre .cp i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;flex:0 0 auto}
.centre .cp.m{border-color:var(--c);color:var(--ink)}
.centre .cp.m i{background:var(--c);border-color:var(--c)}
.centre .cp em{font-style:normal;color:var(--muted);font-size:11.5px}
.centre .item{padding-top:6px}
.centre .csrc{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);margin-top:10px;line-height:1.5}
.centre .csrc a{color:var(--muted)}
.rk.legend{border-left-style:dashed}
.rk.legend .li{font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.4}
.rk.legend .li b{color:var(--ink);font-weight:600}
.rk.legend .seglist{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line2)}
.seglist i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px;background:var(--c)}
.tip{position:absolute;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.35;box-shadow:var(--shadow);max-width:260px;display:none;z-index:5}
.tip b{display:block;font-family:"Space Grotesk",sans-serif;font-size:14px}
.tip .m{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
/* top list */
.top{margin-top:26px}
.item{display:grid;grid-template-columns:92px 1fr;gap:2px 16px;padding:7px 0;border-bottom:1px solid var(--line2)}
.item .d{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);padding-top:3px;font-variant-numeric:tabular-nums}
.item .t{font-size:14.5px}
.item .meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.03em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:var(--panel);text-decoration:none}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.chip.ty{background:var(--blue-soft);border-color:transparent;color:var(--ink)}
.chip.src{color:var(--muted)}
.item .t a{color:var(--blue)}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;align-items:center}
.filters button{font:inherit;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.filters button:disabled{opacity:.45;cursor:not-allowed}
.filters button .n{font-size:11px;opacity:.75;margin-left:3px;font-variant-numeric:tabular-nums}
.filters .lb{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 2px 0 4px}
.filters .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.count{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.count b{color:var(--ink);font-weight:600}
.count a{color:var(--blue)}
.empty{padding:16px 0;color:var(--muted)}
/* members */
.stage{margin:16px 0 4px}
.stage-head{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:5px;margin-bottom:10px}
.stage-head .code{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--c)}
.stage-head h3{font-size:19px;font-weight:600}
.stage-head .sc{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px 10px;display:flex;flex-direction:column;gap:6px;min-width:0;border-top:3px solid var(--c)}
.card .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h4{font-size:15.5px;font-weight:600;line-height:1.25}
.card .city{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.05em;color:var(--muted);white-space:nowrap;padding-top:3px}
.card p{font-size:13px;color:var(--muted);flex:1}
.card .last{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.card .last i{width:9px;height:9px;border-radius:50%;background:var(--rc);display:inline-block;flex:none}
.card .links{display:flex;gap:12px;flex-wrap:wrap;font-family:"IBM Plex Mono",monospace;font-size:11.5px}
.card .links a{text-decoration:none;border-bottom:1px solid transparent}
.card .links a:hover{border-bottom-color:var(--blue)}
.card .note{font-size:11.5px;color:var(--warn)}
.card .tr{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.04em;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:2px 8px;align-self:flex-start}
.offer{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.offer summary{cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--blue);list-style:none;display:flex;align-items:center;gap:6px}
.offer summary::-webkit-details-marker{display:none}
.offer summary::before{content:"+";display:inline-block;width:14px;height:14px;border:1px solid var(--blue);border-radius:4px;font-size:11px;line-height:12px;text-align:center}
.offer[open] summary::before{content:"\2013"}
.offer .ob{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.offer h5{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
.offer ul{padding-left:16px;margin:0;font-size:12.5px;color:var(--ink)}
.offer li{margin:2px 0}

    {"d": "2026-10-27", "a": false, "m": ["apple-european-silicon-design-center"], "ty": "launch", "src": "press", "top": false, "cs": "Představení nových počítačů iMac s čipem Apple M6 (27. 10.) a MacBook Pro s displejem PROLED XDR (28. 10.); na vývoji bezdrátových a RF/5G čipových technologií se významně podílí mnichovský European Silicon Design Center.", "en": "Launch of new iMac computers with the Apple M6 chip (27 Oct) and MacBook Pro with PROLED XDR display (28 Oct); the Munich European Silicon Design Center contributes significantly to the wireless and RF/5G chip technologies.", "de": "Vorstellung neuer iMac-Computer mit dem Chip Apple M6 (27. 10.) und MacBook Pro mit PROLED-XDR-Display (28. 10.); an der Entwicklung der Funk- und RF-/5G-Chiptechnologien ist das Münchner European Silicon Design Center maßgeblich beteiligt.", "u": "https://www.apple.com/uk/newsroom/2026/10/", "sn": "Apple Newsroom", "tyraw": "Produkt / Technologie"},
    {"d": "2026-10-27", "a": false, "m": ["ham-let-germany-gmbh-uct-fluid-solutions"], "ty": "finance", "src": "press", "top": false, "cs": "Mateřská skupina Ultra Clean Holdings (UCT, vlastník značky HAM-LET) oznámila 27. 10. rekordní čtvrtletní tržby za Q3 2026 ve výši 759 mil. USD (+49 % meziročně) tažené poptávkou po UHP plynových a kapalinových rozvodech pro AI čipy a zvýšila výhled na Q4.", "en": "Parent group Ultra Clean Holdings (UCT, owner of the HAM-LET brand) reported on 27 Oct record quarterly revenue of USD 759 million for Q3 2026 (+49% year on year), driven by demand for UHP gas and liquid delivery systems for AI chips, and raised its Q4 outlook.", "de": "Die Muttergesellschaft Ultra Clean Holdings (UCT, Eigentümer der Marke HAM-LET) meldete am 27. 10. einen Rekord-Quartalsumsatz von 759 Mio. USD für Q3 2026 (+49 % gegenüber Vorjahr), getragen von der Nachfrage nach UHP-Gas- und Flüssigkeitsverteilsystemen für KI-Chips, und hob die Q4-Prognose an.", "u": "https://www.prnewswire.com/news-releases/ultra-clean-reports-third-quarter-2026-financial-results-302921159.html", "sn": "prnewswire.com", "tyraw": "Finanční výsledky"},
    {"d": "2026-10-26", "a": false, "m": ["codasip-gmbh"], "ty": "invest", "src": "press", "top": false, "cs": "Strategický obrat směrem ke kyberneticky odolným SoC a bezpečnostní architektuře CHERI RISC-V: firma prodala svou divizi základních low-end RISC-V procesorových jader společnosti onsemi za 14,5 mil. USD a soustředí se na bezpečnostní IP a nástroj Codasip Studio.", "en": "Strategic pivot to cyber-resilient SoCs and the CHERI RISC-V security architecture: the company sold its basic low-end RISC-V processor core line to onsemi for USD 14.5 million and is focusing on security IP and the Codasip Studio tool.", "de": "Strategische Neuausrichtung auf cyberresiliente SoCs und die Sicherheitsarchitektur CHERI RISC-V: Das Unternehmen verkaufte seine Sparte einfacher Low-End-RISC-V-Prozessorkerne für 14,5 Mio. USD an onsemi und konzentriert sich auf Sicherheits-IP und das Werkzeug Codasip Studio.", "u": "https://www.jonpeddie.com/news/onsemi-picks-up-codasips-low-end-risc-v-business-for-14-5-million/", "sn": "jonpeddie.com", "tyraw": "M&A / Strategie"},
    {"d": "2026-10-26", "a": false, "m": ["rambus-gmbh-munich"], "ty": "finance", "src": "press", "top": false, "cs": "Rambus reportoval za Q3 2026 rekordní čtvrtletní tržby 218 mil. USD (+22,3 % meziročně) tažené poptávkou po vysokorychlostních paměťových čipsetech a bezpečnostních IP blocích pro AI servery a datacentra.", "en": "Rambus reported record quarterly revenue of USD 218 million for Q3 2026 (+22.3% year on year), driven by demand for high-speed memory chipsets and security IP blocks for AI servers and data centres.", "de": "Rambus meldete für Q3 2026 einen Rekord-Quartalsumsatz von 218 Mio. USD (+22,3 % gegenüber Vorjahr), getragen von der Nachfrage nach Hochgeschwindigkeits-Speicherchipsätzen und Sicherheits-IP-Blöcken für KI-Server und Rechenzentren.", "u": "https://www.fool.com/earnings/takeaways/2026/10/27/rambus-3-key-takeaways-for-long-term-investors/", "sn": "fool.com", "tyraw": "Finanční výsledky"},
    {"d": "2026-10-22", "a": false, "m": ["formfactor-gmbh"], "ty": "finance", "src": "press", "top": false, "cs": "FormFactor oznámil 28. 10. silné výsledky za Q3 2026 (tržby i marže nad horní hranicí odhadů), otevřel 22. 10. nový výrobní závod v Farmers Branch pro pokročilé probe karty (v návaznosti na spolupráci s Teradyne z 12. 10.) a 9. 11. vydal zprávu o udržitelnosti.", "en": "FormFactor reported strong Q3 2026 results on 28 Oct (revenue and margin above the top of guidance), opened a new plant in Farmers Branch for advanced probe cards on 22 Oct (following the Teradyne collaboration of 12 Oct) and published its sustainability report on 9 Nov.", "de": "FormFactor meldete am 28. 10. starke Q3-2026-Ergebnisse (Umsatz und Marge über dem oberen Ende der Prognose), eröffnete am 22. 10. ein neues Werk in Farmers Branch für fortschrittliche Probecards (im Anschluss an die Zusammenarbeit mit Teradyne vom 12. 10.) und veröffentlichte am 9. 11. seinen Nachhaltigkeitsbericht.", "u": "https://www.formfactor.com/company/news-events/press-releases/", "sn": "formfactor.com", "tyraw": "Investice / Finanční výsledky"},
    {"d": "2026-10-22", "a": false, "m": ["kuka-deutschland-gmbh"], "ty": "partner", "src": "press", "top": false, "cs": "22. 10. 2026 oznámila KUKA Group strategické partnerství s technologickým distributorem KOMSA zaměřené na širší nasazení autonomních mobilních robotů (AMR) v regionu DACH, navazující na čistoprostorové mobilní manipulátory KMR iiwa CR.", "en": "On 22 Oct 2026 KUKA Group announced a strategic partnership with technology distributor KOMSA for wider deployment of autonomous mobile robots (AMR) in the DACH region, building on the cleanroom-capable KMR iiwa CR mobile manipulators.", "de": "Am 22. 10. 2026 gab die KUKA Group eine strategische Partnerschaft mit dem Technologiedistributor KOMSA für den breiteren Einsatz autonomer mobiler Roboter (AMR) in der DACH-Region bekannt, aufbauend auf den reinraumtauglichen mobilen Manipulatoren KMR iiwa CR.", "u": "https://www.kuka.com/en-de/company/press/news", "sn": "KUKA Press Releases", "tyraw": "Partnerství / Automatizace"},
    {"d": "2026-10-20", "a": false, "m": ["semikron-vincotech-gmbh-mitsubishi-elect"], "ty": "event", "src": "press", "top": false, "cs": "Společnost z Unterhachingu oznámila sponzorství nově sloučeného bundesligového volejbalového klubu WWK Volleys München (spojení týmů Herrsching a TSV Haching München) pro sezónu 2026/2027.", "en": "The Unterhaching-based company announced its sponsorship of the newly merged Bundesliga volleyball club WWK Volleys München (merger of the Herrsching and TSV Haching München teams) for the 2026/2027 season.", "de": "Das Unternehmen aus Unterhaching gab das Sponsoring des neu fusionierten Bundesliga-Volleyballclubs WWK Volleys München (Zusammenschluss der Teams Herrsching und TSV Haching München) für die Saison 2026/2027 bekannt.", "u": "https://www.vincotech.com/company/news-events/vincotech-sponsors-wwk-volleys-muenchen/", "sn": "Vincotech Newsroom", "tyraw": "Regionální sponzorství / Komunita"},
    {"d": "2026-10-20", "a": false, "m": ["altair-engineering-gmbh-siemens"], "ty": "launch", "src": "web", "top": false, "cs": "Pokračující integrace portfolia Altair (HyperWorks, RapidMiner, HPCWorks) do platformy Siemens Xcelerator pro elektromagnetické simulace, HPC a AI-řízené digitální dvojčata v návrhu čipů a elektronických systémů.", "en": "Ongoing integration of the Altair portfolio (HyperWorks, RapidMiner, HPCWorks) into the Siemens Xcelerator platform for electromagnetic simulation, HPC and AI-driven digital twins in chip and electronic-system design.", "de": "Fortlaufende Integration des Altair-Portfolios (HyperWorks, RapidMiner, HPCWorks) in die Plattform Siemens Xcelerator für elektromagnetische Simulation, HPC und KI-gesteuerte digitale Zwillinge im Chip- und Elektroniksystementwurf.", "u": "https://www.ien.eu/article/siemens-acquires-altair-engineering/", "sn": "ien.eu", "tyraw": "Integrace / Portfolio"},
    {"d": "2026-10-20", "a": false, "m": ["toptica-photonics-ag"], "ty": "award", "src": "press", "top": false, "cs": "1. 10. 2026 převzal zakladatel Dr. Wilhelm Kaenders novou roli a novým CTO a mluvčím představenstva se stal Dr. Frank Lison (strategie růstu do Semicon/Quantum). 20. 10. 2026 převzal tým TOPTICLOCK cenu 2026 Paul F. Forman Team Engineering Excellence Award na konferenci FiO LS.", "en": "On 1 Oct 2026 founder Dr Wilhelm Kaenders took on a new role and Dr Frank Lison became the new CTO and board spokesman (growth strategy into semicon/quantum). On 20 Oct 2026 the TOPTICLOCK team received the 2026 Paul F. Forman Team Engineering Excellence Award at the FiO LS conference.", "de": "Am 1. 10. 2026 übernahm Gründer Dr. Wilhelm Kaenders eine neue Rolle; neuer CTO und Vorstandssprecher wurde Dr. Frank Lison (Wachstumsstrategie Semicon/Quantum). Am 20. 10. 2026 erhielt das TOPTICLOCK-Team auf der Konferenz FiO LS den 2026 Paul F. Forman Team Engineering Excellence Award.", "u": "https://www.toptica.com/company/latest-news/change-at-toptica-executive-board", "sn": "TOPTICA Newsroom", "tyraw": "Vedení / Ocenění"},
    {"d": "2026-10-15", "a": false, "m": ["trumpf-photonic-components-gmbh-bavaria"], "ty": "finance", "src": "press", "top": false, "cs": "Mateřská skupina TRUMPF oznámila růst zisku a nárůst tržeb v polovodičovém/EUV segmentu o 9,2 % na 791 mil. EUR (dodávky laserů pro ASML) při současném dokončení restrukturalizace a částečného prodeje divize Photonic Components (VCSEL výroba v Ulmu) americkým a tchajwanským investorům.", "en": "Parent group TRUMPF reported profit growth and a 9.2% sales increase to EUR 791 million in its semiconductor/EUV segment (laser deliveries to ASML) while completing the restructuring and partial sale of the Photonic Components division (VCSEL production in Ulm) to US and Taiwanese investors.", "de": "Die Muttergesellschaft TRUMPF meldete Gewinnwachstum und ein Umsatzplus von 9,2 % auf 791 Mio. EUR im Halbleiter-/EUV-Segment (Laserlieferungen an ASML) bei gleichzeitigem Abschluss der Restrukturierung und des Teilverkaufs der Sparte Photonic Components (VCSEL-Fertigung in Ulm) an US-amerikanische und taiwanesische Investoren.", "u": "https://www.trumpf.com/en_INT/newsroom/", "sn": "TRUMPF Newsroom", "tyraw": "Finanční výsledky / M&A"},
    {"d": "2026-10-15", "a": false, "m": ["everprox-technologies-munich-gmbh-silico"], "ty": "media", "src": "linkedin", "top": false, "cs": "Zveřejnění video demonstrace a technického webináře (29. 10. 2026) k novému ultra-nízkopříkonovému SerDes čipsetu MSDL™ 20G (MIPI Serial Data Link, <100 mW na 10 Gbps linku) pro průmyslové kamery a robotiku; navazuje na 20Gbps AOC spolupráci s Infineonem.", "en": "Release of a video demonstration and technical webinar (29 Oct 2026) on the new ultra-low-power SerDes chipset MSDL™ 20G (MIPI Serial Data Link, <100 mW per 10 Gbps lane) for industrial cameras and robotics; follows the 20 Gbps AOC collaboration with Infineon.", "de": "Veröffentlichung einer Videodemonstration und eines technischen Webinars (29. 10. 2026) zum neuen Ultra-Low-Power-SerDes-Chipsatz MSDL™ 20G (MIPI Serial Data Link, <100 mW pro 10-Gbit/s-Lane) für Industriekameras und Robotik; knüpft an die 20-Gbit/s-AOC-Zusammenarbeit mit Infineon an.", "u": "https://www.silicon-line.com/news/", "sn": "Silicon Line News / LinkedIn Video", "tyraw": "Video / Webinář"},
    {"d": "2026-10-15", "a": false, "m": ["vat-deutschland-gmbh"], "ty": "finance", "src": "fair", "top": false, "cs": "Skupina VAT Group oznámila 15. 10. historicky nejvyšší čtvrtletní příjem objednávek a tržby díky poptávce z AI fabů; na SEMICON Europa 2026 v Mnichově (stánek B1.447) vystoupil 11. 11. šéf globálních služeb Marc Osswald na Fab Management Foru.", "en": "VAT Group reported on 15 Oct its highest-ever quarterly order intake and sales on demand from AI fabs; at SEMICON Europa 2026 in Munich (stand B1.447) head of global services Marc Osswald spoke at the Fab Management Forum on 11 Nov.", "de": "Die VAT Group meldete am 15. 10. den höchsten Quartalsauftragseingang und -umsatz ihrer Geschichte dank der Nachfrage aus KI-Fabs; auf der SEMICON Europa 2026 in München (Stand B1.447) sprach der Leiter Global Services Marc Osswald am 11. 11. auf dem Fab Management Forum.", "u": "https://www.vatgroup.com/news/events/semicon-europa-2026", "sn": "vatgroup.com", "tyraw": "Finanční výsledky / Veletrh"},
    {"d": "2026-10-01", "a": false, "m": ["asic-gmbh-lineare-systeme"], "ty": "launch", "src": "web", "top": false, "cs": "Kontinuální zakázkový návrh a realizace zákaznických analogových a smíšených ASIC obvodů pro průmysl, letectví a senzorovou techniku ze sídla v Taufkirchenu u Mnichova (člen Bavarian Chips Alliance; bez samostatné tiskové zprávy v posledním měsíci).", "en": "Ongoing custom design and delivery of analog and mixed-signal ASICs for industry, aerospace and sensing from its Taufkirchen site near Munich (Bavarian Chips Alliance member; no separate press release in the past month).", "de": "Laufende kundenspezifische Entwicklung und Realisierung analoger und Mixed-Signal-ASICs für Industrie, Luftfahrt und Sensorik vom Standort Taufkirchen bei München (Mitglied der Bavarian Chips Alliance; keine eigene Pressemitteilung im letzten Monat).", "u": "https://www.asic-gmbh.de/main_engl.html", "sn": "Firemní web / BCA", "tyraw": "Produkt / Technologie"},

        ["Woher die Daten stammen", "Die Liste der Organisationen entstand durch CNSC-Recherchen in öffentlichen Quellen in fünf Chargen (Unternehmenswebsites, Presse, Register), ergänzt um Wirtschaftsdaten aus vier Chargen (Geschäftsberichte, 10-K/IR, Bundesanzeiger, Handelsregister; gekennzeichnet als verified / estimated) und um 120 Ereignisse aus Oktober–November 2026 mit Direktlinks zur Quelle. Die Zuordnung zu den Segmenten der CNSC-Taxonomie ist vorläufig und wartet auf die Prüfung mit bayerischen Partnern."],

let F = {ty: null, seg: null};
function renderNews() {
  const t = T();
  const fl = $('filters');
  // Type and segment filters combine (AND). Every button shows how many items the click would
  // leave given the other filter, so an empty combination is visible before it is chosen.
  const sorted = [...D.news].sort((a,b) => b.d.localeCompare(a.d));
  const inSeg = (n, seg) => !seg || (n.m || []).some(id => memById[id] && memById[id].s === seg);
  const inTy = (n, ty) => !ty || n.ty === ty;
  const cntTy = ty => sorted.filter(n => inTy(n, ty) && inSeg(n, F.seg)).length;
  const cntSeg = seg => sorted.filter(n => inTy(n, F.ty) && inSeg(n, seg)).length;
  const btn = (k, v, on, label, cnt, style) =>
    `<button data-k="${k}" data-v="${v}" aria-pressed="${on}"${cnt === 0 && !on ? ' disabled' : ''} style="${on && style ? style : ''}">${label} <span class="n">${cnt}</span></button>`;
  fl.innerHTML = btn('all', '', !F.ty && !F.seg, esc(t.all), sorted.length) +
    `<span class="lb">${esc(t.fType)}</span>` +
    D.types.map(x => btn('ty', x.id, F.ty === x.id, esc(L(x)), cntTy(x.id))).join('') +
    `<span class="sep"></span><span class="lb">${esc(t.fSeg)}</span>` +
    D.segments.map(s => btn('seg', s.id, F.seg === s.id, `${esc(s.code)} ${esc(L(s))}`, cntSeg(s.id), `background:${segColor(s.id)};border-color:${segColor(s.id)}`)).join('');
  fl.querySelectorAll('button').forEach(b => b.onclick = () => {
    const k = b.dataset.k, v = b.dataset.v;
    if (k === 'all') F = {ty: null, seg: null}; else F[k] = (F[k] === v) ? null : v;
    renderNews();
  });
  const list = sorted.filter(n => inTy(n, F.ty) && inSeg(n, F.seg));
  const active = [F.ty && L(D.types.find(x => x.id === F.ty)), F.seg && L(D.segments.find(s => s.id === F.seg))].filter(Boolean);
  const nw = list.length === 1 ? t.items1 : (list.length >= 2 && list.length <= 4 ? t.items2 : t.items);
  $('newsCount').innerHTML = `${list.length} ${esc(nw)}` + (active.length ? ` · ${esc(t.filter)}: <b>${active.map(esc).join(' × ')}</b> · <a href="#" data-clear>${esc(t.clear)}</a>` : '');
  const cl = $('newsCount').querySelector('[data-clear]'); if (cl) cl.onclick = e => { e.preventDefault(); F = {ty: null, seg: null}; renderNews(); };
  $('newsList').innerHTML = list.length ? list.map(itemHTML).join('') : `<p class="empty">${esc(t.noitems)}</p>`;
  bindGo($('newsList'));
}

function renderRadar() {
  const t = T();
  const W = 1180, H = 770, C = W / 2, CY = 385, R = [0, 210, 342];
  const segs = D.segments;
  const counts = Object.fromEntries(segs.map(s => [s.id, D.members.filter(m => m.s === s.id).length]));
  const tot = segs.reduce((a, s) => a + Math.max(2, counts[s.id]), 0);
  let ang = -Math.PI / 2; const span = {};
  segs.forEach(s => { const w = Math.max(2, counts[s.id]) / tot * 2 * Math.PI; span[s.id] = [ang, ang + w]; ang += w; });
  let h = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.radarH)}">`;
  for (let i = 2; i >= 1; i--) h += `<circle cx="${C}" cy="${CY}" r="${R[i]}" fill="${i % 2 ? '#141a24' : '#0f141d'}" stroke="#2a3344" stroke-width="1.5"/>`;
  segs.forEach(s => {
    const [a0, a1] = span[s.id];
    h += `<line x1="${C}" y1="${CY}" x2="${(C + R[2] * Math.cos(a0)).toFixed(1)}" y2="${(CY + R[2] * Math.sin(a0)).toFixed(1)}" stroke="#2a3344" stroke-width="1.5"/>`;
    const m = (a0 + a1) / 2, lr = R[2] + 18, x = C + lr * Math.cos(m), y = CY + lr * Math.sin(m);
    const anc = Math.abs(Math.cos(m)) < .25 ? 'middle' : (Math.cos(m) > 0 ? 'start' : 'end'); const yoff = Math.abs(Math.cos(m)) < .25 ? (Math.sin(m) < 0 ? -8 : 18) : 6;
    h += `<text x="${x.toFixed(1)}" y="${(y + yoff).toFixed(1)}" text-anchor="${anc}" font-size="16" font-weight="700" fill="${segColor(s.id)}" font-family="Space Grotesk,Inter,sans-serif">${esc(s.code)} ${esc(L(s))}</text>`;
  });
  for (let i = 1; i <= 2; i++) h += `<text x="${C + 6}" y="${CY - R[i] + 16}" font-size="13" fill="#5d6677" font-family="IBM Plex Mono,monospace">${i}</text>`;
  const dots = [];
  segs.forEach(s => {
    const ms = D.members.filter(m => m.s === s.id);
    const byRing = {1:[],2:[]};
    ms.forEach(m => { const r = ringOf(m.id); if (r <= 2) byRing[r].push(m); });
    const [a0, a1] = span[s.id];
    Object.entries(byRing).forEach(([ring, arr]) => {
      arr.forEach((m, i) => {
        const k = arr.length, a = a0 + (a1 - a0) * (i + 1) / (k + 1);
        // stagger radius inside the ring so dense rings do not overlap
        const r0 = R[ring - 1], r1 = R[ring];
        let frac = 0.55;
        if (ring == 1) frac = k > 3 ? [0.38, 0.66, 0.94][i % 3] : k > 1 ? (i % 2 ? 0.9 : 0.55) : 0.72;
        else if (k > 3) frac = 0.28 + 0.56 * ((i % 3) / 2);
        else if (k > 1) frac = i % 2 ? 0.72 : 0.4;
        const r = r0 + (r1 - r0) * frac;
        dots.push({m, ring: +ring, x: C + r * Math.cos(a), y: CY + r * Math.sin(a), s});
      });
    });
  });
  // labels: greedy placement without overlaps (candidates around the dot; obstacles = other dots, placed labels, sector labels, canvas edge), then a repair pass
  const LH = 17;
  const _cv = document.createElement('canvas').getContext('2d'); _cv.font = '600 14px Inter, sans-serif';
  const tw = s => { try { return Math.max(_cv.measureText(s).width, s.length * 6.9) + 8; } catch (e) { return s.length * 7.8 + 8; } };
  const secRects = segs.map(s => { const [a0, a1] = span[s.id]; const m = (a0 + a1) / 2, lr = R[2] + 18, x = C + lr * Math.cos(m), y = CY + lr * Math.sin(m); const anc = Math.abs(Math.cos(m)) < .25 ? 'middle' : (Math.cos(m) > 0 ? 'start' : 'end'); const yoff = Math.abs(Math.cos(m)) < .25 ? (Math.sin(m) < 0 ? -8 : 18) : 6; const w = (s.code + ' ' + L(s)).length * 9.4; const x0 = anc === 'start' ? x : anc === 'end' ? x - w : x - w / 2; return {x0, x1: x0 + w, y0: y + yoff - 17, y1: y + yoff + 5}; });
  const dotRects = dots.map(d => ({x0: d.x - 11, x1: d.x + 11, y0: d.y - 11, y1: d.y + 11, d}));
  const hit = (r, q) => !(r.x1 <= q.x0 || q.x1 <= r.x0 || r.y1 <= q.y0 || q.y1 <= r.y0);
  const candsFor = (d, wide) => {
    const outward = Math.cos(Math.atan2(d.y - CY, d.x - C)) >= 0;
    const side = outward ? 'start' : 'end', other = outward ? 'end' : 'start', sx = outward ? 13 : -13;
    const c = [];
    const push = (dx, dy, anc) => c.push({dx, dy, anc});
    push(sx, 5, side); push(-sx, 5, other); push(0, -15, 'middle'); push(0, 25, 'middle');
    [13, 26, 39].forEach(k => { push(sx, 5 - k, side); push(sx, 5 + k, side); push(-sx, 5 - k, other); push(-sx, 5 + k, other); push(0, -15 - k, 'middle'); push(0, 25 + k, 'middle'); });
    if (wide) [52, 65, 78, 91, 104].forEach(k => { push(sx, 5 - k, side); push(sx, 5 + k, side); push(-sx, 5 - k, other); push(-sx, 5 + k, other); push(0, -15 - k, 'middle'); push(0, 25 + k, 'middle'); [26, 40].forEach(e => { push(sx + (outward ? e : -e), 5 - k, side); push(sx + (outward ? e : -e), 5 + k, side); }); });
    return c;
  };
  const rectOf = (d, c, w) => { const x = d.x + c.dx, y = d.y + c.dy; const x0 = c.anc === 'start' ? x : c.anc === 'end' ? x - w : x - w / 2; return {x0: x0 - 1, x1: x0 + w + 1, y0: y - 13, y1: y + 4, x, y}; };
  const inBounds = r => r.x0 >= 2 && r.x1 <= W - 2 && r.y0 >= 2 && r.y1 <= H - 2;
  const labels = [];
  const choose = (d, w, others, wide) => {
    let best = null, bestScore = Infinity; const cs = candsFor(d, wide);
    for (let ci = 0; ci < cs.length; ci++) {
      const r = rectOf(d, cs[ci], w); if (!inBounds(r)) continue;
      let bad = 0;
      for (const q of dotRects) if (q.d !== d && hit(r, q)) bad += 4;
      for (const q of others) if (hit(r, q)) bad += 4;
      for (const q of secRects) if (hit(r, q)) bad += 2;
      const score = bad * 1000 + ci;
      if (score < bestScore) { bestScore = score; best = {c: cs[ci], r}; }
      if (bad === 0) break;
    }
    return {best, clash: bestScore >= 1000};
  };
  // dense radars: label only the most relevant dots (top items, financial results/investments, number of items, recency); the rest stay as dots with tooltip
  const nCount = {}, nTop = {}, nFin = {};
  D.news.forEach(n => (n.m || []).forEach(id => { nCount[id] = (nCount[id] || 0) + 1; if (n.top) nTop[id] = 1; if (n.ty === 'finance' || n.ty === 'invest') nFin[id] = 1; }));
  const MAXL = 56;
  const prio = d => (d.ring) * 1000 - (nTop[d.m.id] ? 300 : 0) - (nFin[d.m.id] ? 100 : 0) - Math.min(nCount[d.m.id] || 0, 5) * 20 + Math.hypot(d.x - C, d.y - CY) / 100;
  const order = dots.slice().sort((p, q) => prio(p) - prio(q));
  const labelSet = new Set(order.slice(0, MAXL).map(d => d.m.id));
  const dense = order.length > MAXL;
  order.forEach(d => { if (!labelSet.has(d.m.id)) { labels.push({d, w: 0, r: null, c: null, clash: false, nolabel: true}); return; } const w = tw(d.m.short); const placed = labels.filter(l => l.r).map(l => l.r); let {best, clash} = choose(d, w, placed, false); if (clash) ({best, clash} = choose(d, w, placed, true)); if (clash && dense) { labels.push({d, w: 0, r: null, c: null, clash: false, nolabel: true}); return; } labels.push({d, w, r: best.r, c: best.c, clash}); });
  for (let pass = 0; pass < 3; pass++) {
    let fixedAny = false;
    labels.forEach(l => { if (!l.clash || l.nolabel) return; const others = labels.filter(o => o !== l && o.r).map(o => o.r); const {best, clash} = choose(l.d, l.w, others, true); l.r = best.r; l.c = best.c; l.clash = clash; if (!clash) fixedAny = true; });
    if (!fixedAny) break;
  }
  labels.forEach(l => { if (l.nolabel) return; l.x = l.r.x; l.y = l.r.y; l.anchor = l.c.anc; l.right = l.c.anc === 'start'; l.moved = !(l.c.dy === 5 && Math.abs(l.c.dx) === 13); });
  const nUnl = labels.filter(l => l.nolabel).length;
  labels.forEach(l => {
    const d = l.d;
    h += `<g class="dot" data-id="${d.m.id}" style="cursor:pointer">`;
    if (l.nolabel) { h += `<circle cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="7" fill="${segColor(d.s.id)}" stroke="#0d121a" stroke-width="2"/></g>`; return; }
    if (l.moved) { const ex = l.anchor === 'middle' ? l.x : (l.x + (l.anchor === 'start' ? -3 : 3)); const ey = l.y > d.y ? l.y - 12 : l.y + 3; h += `<line x1="${d.x.toFixed(1)}" y1="${d.y.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#5d6677" stroke-width="1"/>`; }
    h += `<circle cx="${d.x.toFixed(1)}" cy="${d.y.toFixed(1)}" r="8" fill="${segColor(d.s.id)}" stroke="#0d121a" stroke-width="2"/>`;
    h += `<text x="${l.x.toFixed(1)}" y="${l.y.toFixed(1)}" text-anchor="${l.anchor}" font-size="14" font-weight="600" fill="#eef1f6" font-family="Inter,sans-serif">${esc(d.m.short)}</text></g>`;
  });
  if (nUnl) h += `<text x="10" y="16" font-size="12" fill="#8a94a6" font-family="Inter,sans-serif">${esc(({cs:`Popisky u ${labels.length - nUnl} z ${labels.length} aktivních organizací (priorita: hlavní zprávy, finance, počet zpráv); ostatní body ukážou název po najetí myší`,en:`Labels on ${labels.length - nUnl} of ${labels.length} active organisations (priority: top items, finance, number of items); hover the other dots for the name`,de:`Beschriftung bei ${labels.length - nUnl} von ${labels.length} aktiven Organisationen (Priorität: Top-Meldungen, Finanzen, Anzahl Meldungen); die übrigen Punkte zeigen den Namen beim Überfahren`})[LANG] || '')}</text>`;
  h += '</svg>';
  $('radarSvg').innerHTML = h;
  const tip = $('tip'), box = $('radarSvg');
  box.querySelectorAll('.dot').forEach(g => {
    const m = memById[g.dataset.id], n = last[m.id];
    g.addEventListener('mousemove', e => {
      const r = box.getBoundingClientRect();
      tip.style.display = 'block'; tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 270) + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px';
      tip.innerHTML = `<b>${esc(m.n)}</b><span class="m">${esc(L(segById[m.s]))} · ${esc(m.city)}</span><div style="margin-top:4px">${n ? esc(fmt(n.d, n.a)) + ' · ' + esc(L({cs:n.cs,en:n.en,de:n.de})) : esc(T().nolast)}</div>`;
    });
    g.addEventListener('mouseleave', () => tip.style.display = 'none');
    g.addEventListener('click', () => { showTab('members'); const el = document.getElementById('member-' + m.id); if (el) el.scrollIntoView({behavior:'smooth', block:'center'}); });
  });
  const quietN = D.members.filter(m => ringOf(m.id) > 2).length;
  const levels = D.rings.filter(r => r.n <= 2).map(r => {
    const who = D.members.filter(m => ringOf(m.id) === r.n).sort((a,b)=>a.short.localeCompare(b.short)).map(m => `<a href="#member-${esc(m.id)}" data-go="${esc(m.id)}" class="wk" title="${esc(m.n)}">${esc(m.short)}</a>`);
    const w = who.length ? who.join(', ') : `<span style="color:var(--faint)">${esc(t.none)}</span>`;
    return `<div class="rk" style="--c:${ringColor(r.n)}"><div class="n">${esc(t.level)} ${r.n} · ${esc(L({cs:r.desc_cs,en:r.desc_en,de:r.desc_de,nl:r.desc_nl,zh:r.desc_zh}))}</div><div class="t">${esc(L(r))}</div><div class="w">${w}</div></div>`;
  }).join('');
  const seglist = segs.map(s => `<span style="--c:${segColor(s.id)}"><i></i>${esc(s.code)} ${esc(L(s))} (${counts[s.id]})</span>`).join('');
  $('key').innerHTML = levels + `<div class="rk legend" style="--c:var(--line)"><div class="n">${esc(t.legendH)}</div>` +
    t.legend.map(([k, v]) => `<div class="li"><b>${esc(k)}</b> ${esc(v)}</div>`).join('') +
    `<div class="li"><b>${esc(t.legendQuiet)}</b> ${quietN} ${esc(t.legendQuiet2)}</div><div class="seglist">${seglist}</div></div>`;
  $('seglist').innerHTML = '';
  $('key').querySelectorAll('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); goMember(a.dataset.go); });
}

  $('vcstages').querySelectorAll('.vc-stbtn').forEach(bt=>bt.onclick=()=>{const v=bt.dataset.st||null; MAPSEL=(MAPSEL===v)?null:v; renderMap();});
  $('vcmap').innerHTML=MAPG.filter(g=>!MAPSEL||g.id===MAPSEL).map(g=>{const segs=g.codes.filter(c=>byCode[c]); const n=segs.reduce((a,c)=>a+byCode[c].length,0); if(!n) return '';
    return `<div class="vc-stage${g.wide?' wide':''}"><h3>${esc(L(g.t))}</h3><div class="vc-n">${n}</div>`+segs.map(c=>`<div class="vc-seg"><h4><span><code>${esc(c)}</code>${esc(segName(byCode[c][0]))}</span><span>${byCode[c].length}</span></h4><div class="vc-chips">${byCode[c].map(chip).join('')}</div></div>`).join('')+`</div>`;}).join('');

<script>
// search across all tabs: filters news, members, centres, events and about boxes, dims radar dots,
// shows hit counts per tab, keeps ?q= in the URL; survives language switches and filter re-renders
(function(){
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const qwrap = document.createElement('span'); qwrap.className = 'qwrap'; qwrap.setAttribute('role','search');
  qwrap.innerHTML = '<span class="cnt" id="qcnt" hidden></span><input type="search" id="q" aria-label="Search across all tabs"><button type="button" class="clr" id="qclr" hidden aria-label="Clear search" title="Clear">✕</button>';
  const input = qwrap.querySelector('#q'), qcnt = qwrap.querySelector('#qcnt'), qclr = qwrap.querySelector('#qclr');
  function mount(){ const tabs = $('tabs'); if (tabs && !tabs.contains(qwrap)) tabs.appendChild(qwrap); input.placeholder = ({cs:'Hledat v radaru…',en:'Search the radar…',de:'Radar durchsuchen…',nl:'Zoek in de radar…',zh:'搜尋雷達…'})[LANG]; }
  function targets(){
    const t = [];
    const add = (tab, sel, root) => { if (root) root.querySelectorAll(sel).forEach(el => t.push([tab, el])); };
    add('overview', '.item', $('topList'));
    add('news', '.item', $('newsList'));
    add('members', '.card', $('memberList'));
    add('centres', '.centre', $('centreList'));
    add('events', '.ev', $('evList'));
    add('about', '.box', $('about'));
    return t;
  }
  function badge(tab, n){ const b = document.querySelector('nav.tabs button[data-tab="' + tab + '"]'); if (!b) return; let x = b.querySelector('.qhit-badge'); if (n > 0){ if (!x){ x = document.createElement('span'); x.className = 'qhit-badge'; b.appendChild(x); } x.textContent = n; } else if (x) x.remove(); }
  function run(){
    const words = norm(input.value.trim()).split(/\s+/).filter(Boolean);
    const per = {};
    targets().forEach(([tab, el]) => { if (!words.length){ el.classList.remove('qhide'); return; } const txt = norm(el.textContent); const hit = words.every(w => txt.includes(w)); el.classList.toggle('qhide', !hit); if (hit) per[tab] = (per[tab] || 0) + 1; });
    document.querySelectorAll('#radarSvg g.dot').forEach(g => { if (!words.length){ g.classList.remove('qdim'); return; } const m = memById[g.dataset.id]; const n = m && last[m.id]; const txt = norm(m ? [m.n, m.short, m.city, m.cs, m.en, n && n.cs, n && n.en].filter(Boolean).join(' ') : ''); g.classList.toggle('qdim', !words.every(w => txt.includes(w))); });
    document.querySelectorAll('#vcmap .vc-chip[data-go]').forEach(b => { if (!words.length){ b.classList.remove('qdim'); return; } const m = memById[b.dataset.go]; const n = m && last[m.id]; const txt = norm(m ? [m.n, m.short, m.city, m.code, m.cs, m.en, m.de, n && n.cs, n && n.en, n && n.de].filter(Boolean).join(' ') : ''); const hit = words.every(w => txt.includes(w)); b.classList.toggle('qdim', !hit); if (hit) per.map = (per.map || 0) + 1; });
    document.querySelectorAll('#vcmap .vc-seg').forEach(s => s.classList.toggle('qhide', !!words.length && !s.querySelector('.vc-chip[data-go]:not(.qdim)')));
    document.querySelectorAll('#vcmap .vc-stage').forEach(s => s.classList.toggle('qhide', !!words.length && !s.querySelector('.vc-seg:not(.qhide)')));
    document.querySelectorAll('nav.tabs button[data-tab]').forEach(b => badge(b.dataset.tab, words.length ? (per[b.dataset.tab] || 0) : 0));
    const total = Object.values(per).reduce((a, b) => a + b, 0);
    qcnt.hidden = qclr.hidden = !words.length;
    qcnt.textContent = words.length ? total + ({cs:' výsledků',en:' matches',de:' Treffer',nl:' resultaten',zh:' 筆結果'})[LANG] : '';
    try { const u = new URL(location.href); if (words.length) u.searchParams.set('q', input.value.trim()); else u.searchParams.delete('q'); history.replaceState(null, '', u); } catch(e){}
  }
  let deb = 0;
  input.addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(run, 120); });
  qclr.addEventListener('click', () => { input.value = ''; run(); input.focus(); });
  // re-mount and re-run after the page re-renders itself (language switch, news filters, radar redraw)
  const wrap = name => { const f = window[name]; if (typeof f === 'function') window[name] = function(){ const r = f.apply(this, arguments); mount(); run(); return r; }; };
  ['renderAll', 'renderNews', 'renderRadar', 'renderMap'].forEach(wrap);
  mount();
  try { const q0 = new URLSearchParams(location.search).get('q'); if (q0) input.value = q0; } catch(e){}
  run();
})();

;(function(){
  let CC='';
  function apply(){
    document.querySelectorAll('#memberList .card').forEach(c=>{const v=c.dataset.cc||'';c.style.display=(!CC||v===CC||(CC==='2.4'&&v.startsWith('2.4')))?'':'none';});
    document.querySelectorAll('#memberList .stage').forEach(s=>{const n=[...s.querySelectorAll('.card')].filter(c=>c.style.display!=='none').length;s.style.display=n?'':'none';const sc=s.querySelector('.sc');if(sc&&sc.textContent!==String(n))sc.textContent=n;});
  }
  function ui(){
    const list=$('memberList');if(!list)return;
    let bar=$('ccBar');if(!bar){bar=document.createElement('div');bar.id='ccBar';bar.style.cssText='margin:0 0 14px;font:500 14px Inter,sans-serif';list.parentNode.insertBefore(bar,list);}
    const en=LANG==='en';
    const codes={};D.members.forEach(m=>{codes[m.code]=(codes[m.code]||0)+1});
    const order=Object.keys(codes).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    const nm=c=>{const m=D.members.find(x=>x.code===c);const t=(m?(LANG==='de'?m.de:en?m.en:m.cs):'').replace(/^[^ ]+ /,'').split('. ')[0].replace(/\.$/,'');return c+' '+t;};
    bar.innerHTML='<label>'+(en?'Segment: ':'Segment: ')+'<select id="ccSel" style="font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:inherit;max-width:100%"><option value="">'+(LANG==='de'?'Alle':en?'All':'Všechny')+' ('+D.members.length+')</option><option value="2.4"'+(CC==='2.4'?' selected':'')+'>2.4 '+(LANG==='de'?'Subsysteme und Komponenten (alle)':en?'Subsystems and components (all)':'Subsystémy a komponenty (vše)')+' ('+order.filter(c=>c.startsWith('2.4')).reduce((a,c)=>a+codes[c],0)+')</option>'+order.map(c=>'<option value="'+c+'"'+(c===CC?' selected':'')+'>'+esc(nm(c))+' ('+codes[c]+')</option>').join('')+'</select></label>';
    $('ccSel').onchange=e=>{CC=e.target.value;apply();};
    apply();
  }
  const ml=$('memberList');
  if(ml){new MutationObserver(()=>ui()).observe(ml,{childList:true});ui();}
})();
